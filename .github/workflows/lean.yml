# lean — build the Lean development and verify its axiom claims.
#
# WHY THIS EXISTS. Before this workflow, programs/co-emergence/lean/ was pinned,
# apparently sorry-free, and asserted in a LaTeX remark (rem:lean_entropy_excess)
# to rest only on Mathlib's standard axioms — and no machine had re-run that
# check since the day it was written. A machine check nobody re-runs is an
# attestation, not a check. The 2026-07-24 audit found the same pattern in the
# citation layer: two misattributions sat green on `main` from March to July
# because nothing ever re-examines standing state.
#
# That is what Lean is actually for here. Not to raise more results to Rigorous
# — this program is already over-weighted toward verification — but to
# re-assert, forever and at near-zero marginal cost, that what was proved is
# still proved. Hence the schedule trigger: this job's value is in running when
# nobody has touched anything.
#
# The axiom check is GENERATED FROM THE CLAIM GRAPH, not from a hand-maintained
# list. Each formal node declares `formal.decl` and `formal.axioms`; this job
# asserts exactly those. A declaration renamed in Lean, or misrecorded in a
# node, fails loudly instead of drifting. (That failure mode is not
# hypothetical: the nodes were first written with the wrong namespace.)

name: lean

on:
  pull_request:
    paths:
      - 'programs/*/lean/**'
      - 'programs/*/claims/lean-*.md'
      - '.github/workflows/lean.yml'
  schedule:
    # Mondays 06:00 UTC — standing re-verification, the point of the job.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write        # the scheduled run writes the build result back
  pull-requests: write   # ... via a branch and PR, matching metrics.yml

jobs:
  build:
    name: build and verify axioms
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/co-emergence/lean
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Keyed on the toolchain and the resolved dependency manifest, so a
      # Mathlib bump invalidates it and nothing else does.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: programs/co-emergence/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('programs/co-emergence/lean/lean-toolchain', 'programs/co-emergence/lean/lake-manifest.json') }}

      # Without this a Mathlib build from source dominates the run.
      - name: Fetch Mathlib cache
        run: lake exe cache get || echo "::warning::cache get failed; building from source"

      - name: Build
        id: build
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/lake-build.txt

      # `sorry` is a warning in Lean 4, not an error, so the build alone does
      # not catch it.
      - name: Assert no sorry
        run: |
          if grep -q "declaration uses 'sorry'" /tmp/lake-build.txt; then
            echo "::error::Lean build contains 'sorry'"
            grep -n "declaration uses 'sorry'" /tmp/lake-build.txt
            exit 1
          fi
          echo "No 'sorry' in build output."

      - name: Generate the axiom check from the claim graph
        working-directory: ${{ github.workspace }}
        run: |
          python tools/claim_graph.py formal --program co-emergence > /tmp/formal.json
          cat /tmp/formal.json
          python - <<'PY' > programs/co-emergence/lean/CheckAxioms.lean
          import json
          nodes = json.load(open("/tmp/formal.json"))
          if not nodes:
              raise SystemExit("no formal nodes in the claim graph for this program")
          print("import CoEmergence")
          for n in nodes:
              decl = n["decl"]
              if not decl:
                  raise SystemExit(f"formal node {n['id']} has no `formal.decl`")
              print(f"#print axioms {decl}")
          PY
          cat programs/co-emergence/lean/CheckAxioms.lean

      - name: Verify axioms match what the graph claims
        run: |
          set -o pipefail
          lake env lean CheckAxioms.lean 2>&1 | tee /tmp/axioms.txt

          # An unknown identifier means a node's `formal.decl` does not exist.
          if grep -qiE "unknown (identifier|constant)" /tmp/axioms.txt; then
            echo "::error::a claim node names a declaration that does not exist in Lean"
            exit 1
          fi

          if grep -q "sorryAx" /tmp/axioms.txt; then
            echo "::error::a declaration depends on sorryAx"
            exit 1
          fi

          # Anything outside Mathlib's standard three is an axiom the reader
          # never agreed to.
          UNEXPECTED=$(grep -oE '\[[^]]*\]' /tmp/axioms.txt \
            | tr ',' '\n' | tr -d '[] ' | sed '/^$/d' | sort -u \
            | grep -vE '^(propext|Classical\.choice|Quot\.sound)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::non-standard axioms present:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "Axioms verified against the claim graph."

      - name: Report to job summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## Lean"
            echo
            echo "Formal nodes asserted, generated from the claim graph:"
            echo
            echo '```'
            cat /tmp/axioms.txt 2>/dev/null || echo "(no axiom output — build may have failed)"
            echo '```'
            echo
            echo "On success, each formal node's \`formal.last_built\` should be"
            echo "updated to today with \`result: pass\`. Until that write-back is"
            echo "wired, lint L10 continues to fire and mechanical coverage reads 0."
          } >> "$GITHUB_STEP_SUMMARY"

      # WRITE-BACK, scheduled runs only.
      #
      # Without this the graph never learns the build happened: L10 keeps firing
      # and mechanical coverage keeps reading zero while CI is green. The check
      # runs, the record does not know -- the same shape of gap as a machine
      # check nobody re-runs, one level up.
      #
      # Not on pull requests: a PR should not mutate the graph as a side effect
      # of being tested.
      #
      # Branch -> PR -> auto-merge, matching metrics.yml. `record-build` is
      # idempotent and reports what it changed, so an unchanged value opens no
      # pull request and the weekly run is silent when there is nothing to say.
      - name: Record the build result in the claim graph
        if: github.event_name == 'schedule' && success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CHANGED=$(python tools/claim_graph.py record-build \
            --program co-emergence --result pass \
            | python -c "import json,sys; print(len(json.load(sys.stdin)['changed']))")
          if [ "$CHANGED" = "0" ]; then
            echo "Build record already current; nothing to write."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="lean-build-record-$DATE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add programs/*/claims/
          git commit -m "Record lean build result ($DATE)

          Written by lean.yml after a green build: lake build succeeded, no
          'sorry' in the output, and every declaration named by a formal node
          verified against Mathlib's standard axioms. Updates formal.last_built
          so the graph records a machine check rather than an assertion."
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          PR_URL=$(gh pr create --repo "$REPO" --head "$BRANCH" \
            --title "Record lean build result ($DATE)" \
            --body "Automated write-back from lean.yml. Not an agent research PR; quorum-exempt by design. Updates \`formal.last_built\` on formal claim nodes after a verified build." \
            2>/dev/null || gh pr view "$BRANCH" --repo "$REPO" --json url --jq .url)
          gh pr merge --repo "$REPO" --auto --squash "$PR_URL" || true
          echo "Opened $PR_URL"
