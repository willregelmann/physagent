name: autonomy-generator

# Scheduled caller for the generator routine (automation/routines/generator.md).
#
# The generative tier. Produces speculations against the claim graph; scored on
# survival rate, never volume. Most of its output is expected to die under the
# adversary, and that is the design working.
#
# CADENCE, chosen deliberately rather than copied. The design review that
# produced this routine found the old pipeline's defect was slow upstream
# stages starving a daily producer: scout supplied at most 2 issues/week
# against 7 worker attempts/week, and idea-to-claimable ran 3-4 weeks across
# three weekly-or-slower hops. So generator and adversary are BOTH daily and
# paired an hour apart -- nothing accumulates unadjudicated overnight, and the
# generative tier cannot become the new bottleneck it was built to remove.
#
# Runs before the adversary, so a day's speculations are adjudicated the same
# day rather than aging a full cycle.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  generator:
    uses: ./.github/workflows/autonomy-routine.yml
    with:
      role: generator
      model: ${{ vars.MODEL_GENERATOR || 'claude-opus-4.6' }}
    secrets: inherit
